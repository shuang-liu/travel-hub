    if (!state.editMode) state.activeEdit = null;
    document.body.classList.toggle('edit-mode', state.editMode);
    e.currentTarget.classList.toggle('active', state.editMode);
    e.currentTarget.textContent = state.editMode ? 'Done' : 'Edit';
    render();
    if (state.editMode) showToast('Tap any item to edit');

      ? 'Collapse<span class="hide-xs"> all</span>'

  };

  document.getElementById('removeDoneBtn').onclick = removeCheckedTasks;

  document.getElementById('localFileInput').onchange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const text = await file.text();
    state.md = text;
    state.dirty = true;
    lsSet(keyMd(), text);
    lsSet(keyDirty(), '1');
    idbPut(idbMdKey(), text);
    state.parsed = parsePlan(text);
    updateDirtyIndicator();
    render();
    showToast(`Loaded ${file.name}`);
  };

  async function loadSameOriginPlan(force = false) {
    if (!location.protocol.startsWith('http')) return;
    try {
      const res = await fetch('./plan.md', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      let md = await res.text();

      if (force || !state.dirty) {
        state.md = md;
        state.dirty = false;
        lsSet(keyMd(), md);
        lsSet(keyDirty(), '0');
        await idbPut(idbMdKey(), md);
        state.parsed = parsePlan(md);
        updateDirtyIndicator();
        render();
      }
      (async () => {
        for (const fname of getReferencedPdfs(md)) {
          if (!(await idbGet(idbPdfKey(fname)))) {
            try {
              const pr = await fetch('./attachments/' + fname);
              if (pr.ok) { const pb = new Blob([await pr.blob()], { type: 'application/pdf' }); await idbPut(idbPdfKey(fname), pb); registerPdfBlobUrl(fname, pb); }
            } catch (_) {}
          }
        }
      })();
    } catch (_) {
      if (!state.md) {
        const cachedMd = await idbGet(idbMdKey());
        if (cachedMd) {
          state.md = cachedMd;
          state.parsed = parsePlan(cachedMd);
          render();
        }
      }
      // On split public-shell deployment (no same-origin ./plan.md), auto-sync active trip from private GitHub repo when clean
      const cfg = getGhCfg();
      if (cfg.repo && cfg.token && !state.dirty && navigator.onLine !== false) {
        await pullFromGitHub(true);
        if (state.md) return;
      }
      if (!state.md) {
        document.getElementById('appMain').innerHTML = `<div class="panel">Open <strong>Sync</strong> to pull <code>plan.md</code> from GitHub or load a local file.</div>`;
      }
    }
  }

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').then((reg) => reg.update()).catch(() => {});
  }

  const sysDarkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  let themePref = lsGet(LS_THEME) || 'system';
  if (!['system', 'light', 'dark'].includes(themePref)) themePref = 'system';

  function applyTheme(pref) {
    themePref = pref;
    const isDark = pref === 'dark' || (pref === 'system' && sysDarkMq?.matches);
    if (pref === 'system') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', pref);
    }
    const meta = document.getElementById('themeColorMeta');
    if (meta) meta.setAttribute('content', isDark ? '#0b0e14' : '#f5efe6');
    document.querySelectorAll('.theme-opt').forEach((b) => {
      b.classList.toggle('active', b.dataset.themeOpt === pref);
    });
  }

  document.querySelectorAll('.theme-opt').forEach((btn) => {
    btn.onclick = () => {
      const next = btn.dataset.themeOpt;
      lsSet(LS_THEME, next);
      applyTheme(next);
    };
  });
  if (sysDarkMq?.addEventListener) {
    sysDarkMq.addEventListener('change', () => { if (themePref === 'system') applyTheme('system'); });
  }
  applyTheme(themePref);

  updateDirtyIndicator();
  if (state.md) {
    state.parsed = parsePlan(state.md);
    render();
  }
  loadSameOriginPlan(false);
})();
</script>
</body>
</html>
